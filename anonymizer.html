<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCF Data Anonymizer Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for client-side Excel reading/writing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #f8fafc; color: #1e293b; }
    .tcf-green-bg { background-color: #008744; }
    .tcf-hover-green:hover { background-color: #006b35; }
  </style>
</head>
<body class="p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Navigation / Header Banner -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-t-4 border-t-[#008744] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-emerald-100 text-[#008744] text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Privacy Tool</span>
          <h1 class="text-2xl font-bold text-slate-800">Field Data Anonymizer</h1>
        </div>
        <p class="text-xs text-slate-500 mt-1">Safely sanitize PII (Names, Phone Numbers, Emails) client-side before processing or sharing.</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-300 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Back to Ticket Analyzer
        </a>
      </div>
    </div>

    <!-- Upload & Options Section -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-5">
      <div>
        <label for="anonFile" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Select File to Anonymize (.xlsx, .csv)
        </label>
        <input 
          type="file" 
          id="anonFile" 
          accept=".xlsx, .xls, .csv" 
          class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-[#008744] hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-lg bg-slate-50"
        >
      </div>

      <!-- Anonymization Rules -->
      <div class="space-y-2 pt-2 border-t border-slate-100">
        <span class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Masking Rules</span>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <label class="flex items-center gap-2 text-xs text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-emerald-50/50">
            <input type="checkbox" id="maskPhone" checked class="accent-[#008744]">
            <span>Mask Phone Numbers</span>
          </label>
          <label class="flex items-center gap-2 text-xs text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-emerald-50/50">
            <input type="checkbox" id="maskEmail" checked class="accent-[#008744]">
            <span>Mask Email Addresses</span>
          </label>
          <label class="flex items-center gap-2 text-xs text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-emerald-50/50">
            <input type="checkbox" id="maskNames" checked class="accent-[#008744]">
            <span>Pseudonymize Names</span>
          </label>
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button 
          onclick="runAnonymizer()" 
          class="tcf-green-bg tcf-hover-green text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors shadow-sm"
        >
          Anonymize Data
        </button>
        <button 
          id="downloadBtn" 
          onclick="downloadAnonymized()" 
          disabled
          class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-5 py-2.5 rounded-lg text-xs transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Download Clean Excel
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="anonStatus" class="hidden text-xs text-[#008744] bg-emerald-50 border border-emerald-200 p-4 rounded-lg flex items-center justify-between">
      <span id="anonStatusText" class="font-medium">Processing...</span>
      <span id="anonStatsText" class="text-slate-500 font-mono"></span>
    </div>

    <!-- Anonymized Preview Table -->
    <div id="anonTableContainer" class="hidden bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h2 class="text-sm font-bold text-slate-800">Sanitized Data Preview (First 50 Rows)</h2>
        <span class="text-xs text-emerald-700 font-medium">100% Client-Side Processing</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-700">
          <thead id="anonTableHeader" class="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200"></thead>
          <tbody id="anonTableBody" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let sanitizedWorkbookData = [];
    let sanitizedHeaders = [];

    function runAnonymizer() {
      const fileInput = document.getElementById('anonFile');
      const status = document.getElementById('anonStatus');
      const statusText = document.getElementById('anonStatusText');
      const statsText = document.getElementById('anonStatsText');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!fileInput.files.length) {
        alert('Please select a spreadsheet file to anonymize.');
        return;
      }

      status.classList.remove('hidden');
      statusText.innerText = 'Reading spreadsheet...';

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

          if (rows.length === 0) {
            alert('File is empty.');
            return;
          }

          sanitizedHeaders = rows[0];
          const rawDataRows = rows.slice(1);

          const doPhone = document.getElementById('maskPhone').checked;
          const doEmail = document.getElementById('maskEmail').checked;
          const doNames = document.getElementById('maskNames').checked;

          const nameMap = new Map();
          let userCounter = 1;

          sanitizedWorkbookData = rawDataRows.map(row => {
            return row.map((cell, idx) => {
              let val = String(cell);
              const header = String(sanitizedHeaders[idx] || '').toLowerCase();

              // Mask Emails
              if (doEmail && (header.includes('email') || val.includes('@'))) {
                val = val.replace(/([^@\s]+)@([^@\s]+)/g, 'user_****@tcf.org.pk');
              }

              // Mask Phone Numbers
              if (doPhone && (header.includes('phone') || header.includes('mobile') || header.includes('contact') || /\+?\d{10,13}/.test(val))) {
                val = val.replace(/\+?\d[\d\s-]{8,}/g, 'XXXX-XXXXXXX');
              }

              // Pseudonymize Names
              if (doNames && (header.includes('name') || header.includes('user') || header.includes('assignee') || header.includes('created'))) {
                if (val && val.trim().length > 1 && !/XX|user_/i.test(val)) {
                  if (!nameMap.has(val)) {
                    nameMap.set(val, `Field_User_${userCounter++}`);
                  }
                  val = nameMap.get(val);
                }
              }

              return val;
            });
          });

          // Render Preview
          document.getElementById('anonTableHeader').innerHTML = '<tr>' + sanitizedHeaders.map(h => `<th class="p-3">${escapeHtml(String(h))}</th>`).join('') + '</tr>';
          document.getElementById('anonTableBody').innerHTML = sanitizedWorkbookData.slice(0, 50).map(r => {
            return '<tr class="hover:bg-slate-50 transition-colors">' + r.map(c => `<td class="p-3 whitespace-nowrap">${escapeHtml(String(c))}</td>`).join('') + '</tr>';
          }).join('');

          document.getElementById('anonTableContainer').classList.remove('hidden');
          statusText.innerText = 'Anonymization Complete!';
          statsText.innerText = `Sanitized ${sanitizedWorkbookData.length} rows`;
          downloadBtn.disabled = false;

        } catch (err) {
          alert('Error processing file: ' + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function downloadAnonymized() {
      if (!sanitizedWorkbookData.length) return;

      const wsData = [sanitizedHeaders, ...sanitizedWorkbookData];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Sanitized_Data");
      XLSX.writeFile(wb, "TCF_Anonymized_Tickets.xlsx");
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
